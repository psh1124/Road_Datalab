            <!----svg 개빡센거---->
            <svg viewBox="10 -10 300 340">
              <defs>
                <linearGradient id="linearGradient" x1="13" y1="193.5" x2="307" y2="193.5"

                  <stop style="stop-color: #ff00ff" offset="0" />

                <!----비번---->
                <label for="password" style="font-size: 20px; margin-top: 20px;">Password</label>
                <input type="password" id="password" placeholder="Enter your password" required
                  style="font-size: 22px;" />

                <!----제출버튼---->
                <input type="submit" id="submit" value="Submit" class="login-form" style="font-size: 24px;" />
