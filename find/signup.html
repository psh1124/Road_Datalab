<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>로그인</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../find/signup.css" />
  <link rel="stylesheet" href="../base.css" />
  <link rel="shortcut icon" href="../favicon.png">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
</head>

<body>
  <header>
    <div class="container">
      <h1>
        <a href="../home/home.html" class="no-style"><img src="../name.png" alt="Logo" class="logo" /></a>
      </h1>
      <nav>
        <ul>
          <li><a href="../home/home.html">Home</a></li>
          <li><a href="../login/login.html">Log In</a></li>
          <li><a href="../find/signup.html">Sign Up</a></li>
          <li><a href="../function/map.html">Function</a></li>
          <li><a href="#">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>
  <div class="page-wrapper">
    <main>
      <div class="page">
        <div class="container2">
          <!-- 왼쪽 안내 패널 -->
          <div class="left">
            <span>
              <img src="../black_name.png" alt="Logo" style="margin-left:30px; width:300px;" />
            </span>
            <div class="eula">
              국립안동대학교 빅데이터 회원가입<br />
              스마트 카셰어링 차고지 솔루션
            </div>
            <div class="info">
              <p>• 회원가입 시 이메일과 비밀번호를 <br>정확히 입력해주세요.</p>
              <p>• 비밀번호는 최소 6자리 이상이어야 합니다.</p>
              <p style="color: red";>• 개인정보는 안전하게 관리됩니다.<br/>(실제 기입x)</p>
            </div>
          </div>

          <!-- 오른쪽 폼 패널 -->
          <div class="right">
            <div class="form">
              <label for="email">ID (이메일)</label>
              <input type="email" id="email" placeholder="Enter your email" required />

              <label for="password">Password</label>
              <input type="password" id="password" placeholder="Enter your password" required />

              <label for="passwordConfirm">Confirm Password</label>
              <input type="password" id="passwordConfirm" placeholder="Confirm your password" required />

              <label for="name">Name</label>
              <input type="text" id="name" placeholder="Enter your name" required />

              <label for="phone">Phone Number</label>
              <input type="text" id="phone" placeholder="Enter your phone number" required />

              <label for="birth">Birth Date</label>
              <input type="date" id="birth" required />

              <label for="address">Address</label>
              <input type="text" id="address" placeholder="Enter your address" />

              <input type="submit" id="submit" value="Sign Up" />
            </div>
          </div>
        </div>
      </div>
    </main>

    <footer>
      <div>
        <p>&copy; 2024 Road_Datalab. All Rights Reserved.</p>
      </div>
    </footer>
  </div>
  <script src="signup.js"></script>
</body>

</html>
